<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#376352">
<title>TPAC — ماكو إنترنت</title>
<style>
  :root { --ink: #111; --paper: #fbfaf7; --pine: #376352; --amber: #e3963c; --mute: #6b6b66; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f2efe8; --paper: #0f1513; --mute: #a8a59e; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: Tahoma, "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; padding: 24px 16px max(24px, env(safe-area-inset-bottom)); text-align: center; }
  main { max-width: 360px; }
  .logo { width: 88px; height: 88px; border-radius: 22px; display: block; margin: 0 auto 24px; }
  h1 { font-size: 26px; margin: 0 0 8px; line-height: 1.4; }
  p { margin: 0 0 6px; line-height: 1.8; color: var(--mute); }
  .en { direction: ltr; font-size: 14px; margin-top: 14px; }
  button { margin-top: 26px; min-height: 48px; min-width: 200px; border: 0; border-radius: 999px; background: var(--pine); color: #fff; font: inherit; font-weight: bold; font-size: 16px; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/brand/icon-192.png" alt="TPAC" width="88" height="88">
  <h1>ماكو اتصال بالإنترنت</h1>
  <p>تأكد من الواي فاي أو بيانات الموبايل وجرّب مرة ثانية. سلتك محفوظة وما راح تضيع.</p>
  <p class="en">You're offline. Check your connection and try again — your bag is saved.</p>
  <button type="button" onclick="location.reload()">جرّب مرة ثانية · Try again</button>
</main>
<script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
